<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#4f46e5" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#grad)" />
  <!-- 内圈圆环 -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="white" stroke-width="28" stroke-dasharray="720 230" stroke-linecap="round" filter="url(#shadow)" opacity="0.95" />
  <!-- 时针与分针 -->
  <line x1="256" y1="256" x2="256" y2="170" stroke="white" stroke-width="24" stroke-linecap="round" />
  <line x1="256" y1="256" x2="330" y2="256" stroke="white" stroke-width="24" stroke-linecap="round" />
  <!-- 中心轴点 -->
  <circle cx="256" cy="256" r="22" fill="white" />
</svg>
